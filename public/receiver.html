<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshare Receiver</title>
<!-- Signaling hub host. Preferred: set it at deploy time via the SIGNALING_HUB
     env var (baked into the gitignored js/config.js by `pnpm build`), so the
     host isn't committed. This <meta> is a no-build alternative — fill in
     content="signaling.example.com". Both empty ⇒ this page's own origin (local
     server.ts / offline LAN). See the README. -->
<meta name="signaling-hub" content="">
<script src="/js/config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* TV-remote color palette (the color→device mapping lives in rtc-utils.ts) */
  :root {
    --c-red: #e5484d;
    --c-green: #30a46c;
    --c-yellow: #f5d90a;
    --c-blue: #60a5fa;
  }

  body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  /* ── Layout container ──
     Tile geometry is NOT in this stylesheet: with four devices the arrangements
     (focus target × Only/PIP/All × grid shape) are far too many to hand-write, so
     src/client/layout.ts computes each tile's rect as a percentage of the stage
     and receiver.ts applies it inline. What lives here is only what a tile LOOKS
     like, per kind. The transition below is what animates every rearrangement. */
  #stage {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .tile {
    position: absolute;
    transition: top 0.25s ease, left 0.25s ease, width 0.25s ease, height 0.25s ease;
  }
  .tile[hidden] { display: none; }

  .slot {
    background: #111;
    overflow: hidden;
  }

  /* A PIP thumbnail is a distinct object floating over the focused picture; a
     grid cell is a pane of one surface, separated by a hairline instead. */
  .slot.kind-corner {
    border: 2px solid #333;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  }
  .slot.kind-cell { border: 1px solid #000; cursor: pointer; }

  .slot video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Hide native video placeholder when no source */
  .slot.disconnected video { visibility: hidden; }

  /* ── Empty state overlay ── */
  .slot .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #555;
    font-size: 0.9rem;
    pointer-events: none;
    text-align: center;
    padding: 8px;
  }
  .slot.connected .overlay { display: none; }
  .slot.disconnected .overlay { display: flex; }
  .slot.kind-corner .overlay { font-size: 0.7rem; gap: 8px; }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(1); }
    50%       { opacity: 0.6;  transform: scale(1.08); }
  }
  .slot .overlay .ring {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #444;
    animation: pulse 2s ease-in-out infinite;
    flex: none;
  }
  .slot.kind-corner .overlay .ring { width: 22px; height: 22px; }

  /* ── Device identity dot (letter inside; see deviceLetter in rtc-utils.ts) ── */
  .dot {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    flex: none;
    background: var(--accent, #666);
    color: #000;
    font: 700 9px/15px system-ui, sans-serif;
    text-align: center;
    letter-spacing: 0;
  }

  /* ── Per-device name tag ──
     Shown wherever a pane shares the screen with another (grid cells, PIP
     corners); a single full-bleed picture needs no label. */
  .slot .tag {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,0.72);
    color: rgba(255,255,255,0.85);
    font-size: 0.8rem;
    pointer-events: none;
    white-space: nowrap;
    z-index: 5;
  }
  .slot.kind-cell.connected .tag,
  .slot.kind-corner.connected .tag { display: flex; }
  .slot.kind-corner .tag { bottom: 8px; gap: 5px; padding: 3px 9px; font-size: 0.62rem; }
  .slot.kind-corner .tag .dot { width: 12px; height: 12px; font-size: 8px; line-height: 12px; }

  /* ── Join tile ──
     The invitation to be the next sender, always a full grid cell (one device: a
     50/50 alongside; three: the empty fourth cell of the 2×2). It never floats
     over a pane, so there is no card variant. */
  /* :not([hidden]) matters: an id selector would otherwise out-specify the
     .tile[hidden] rule above and leave the tile on screen when it's laid out. */
  #joinTile:not([hidden]) {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0d;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .join-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 10px;
    text-align: center;
  }
  .join-qr {
    width: 148px;
    height: 148px;
    border-radius: 8px;
    background: #fff;
    padding: 7px;
    image-rendering: pixelated;
  }
  .join-text { color: #888; font-size: 0.82rem; line-height: 1.5; }
  .join-text .join-domain,
  .join-text .join-code {
    color: #cfcfcf;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }

  /* ── Controls bar ── */
  #controls {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    gap: 16px;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 100;
  }
  /* Visibility is driven solely by the idle timer — not by focus, or the bar
     would stay pinned open whenever the layout button holds focus (e.g. after a
     TV remote color-button press) and never auto-hide. */
  body:not(.idle) #controls { opacity: 1; }

  #layoutBtn {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    outline: 2px solid transparent;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #layoutBtn:focus { outline-color: #60a5fa; }
  #layoutBtn:hover { background: rgba(255,255,255,0.2); }
  #layoutBtn .dots { display: flex; gap: 4px; align-items: center; }
  #layoutBtn .dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.2s;
  }
  #layoutBtn .dots span.active { background: rgba(255,255,255,0.85); }

  /* ── Fullscreen toggle (icon button in the controls bar) ── */
  #fullscreenBtn {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background 0.15s;
    outline: 2px solid transparent;
    display: flex;
    align-items: center;
  }
  #fullscreenBtn:focus { outline-color: #60a5fa; }
  #fullscreenBtn:hover { background: rgba(255,255,255,0.2); }
  #fullscreenBtn svg { display: block; }
  /* Show the "enter" glyph normally, the "exit" glyph while fullscreen. */
  #fullscreenBtn .fs-exit { display: none; }
  body.fullscreen #fullscreenBtn .fs-enter { display: none; }
  body.fullscreen #fullscreenBtn .fs-exit { display: block; }
  /* Hidden by JS on platforms with no Fullscreen API (e.g. iOS Safari). */
  #fullscreenBtn.unsupported { display: none; }

  /* ── Hint ── */
  #hint {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.7);
    color: rgba(255,255,255,0.5);
    font-size: 0.75rem;
    padding: 6px 14px;
    border-radius: 999px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 200;
    white-space: nowrap;
  }
  #hint.show { opacity: 1; }

  /* ── Color-key legend (shown on a TV color-button press) ── */
  #legend {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
  }
  #legend.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #legendView {
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  #legend .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.06);
    white-space: nowrap;
    transition: color 0.2s, background 0.2s, opacity 0.2s;
  }
  #legend .pill.active { color: #fff; background: rgba(255,255,255,0.18); }
  /* A slot nobody has joined: the key does nothing, and says so by fading. */
  #legend .pill.absent { opacity: 0.32; }
  #legend .pill .next { color: rgba(255,255,255,0.6); font-size: 0.72rem; }

  /* ── Room join panel (code + QR), shown until a device is streaming ── */
  #roomPanel {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #roomPanel.hidden { opacity: 0; visibility: hidden; }
  /* The TV-viewing chrome (stage, controls, legend, hint) is wrapped in #tvView;
     while the join card is up, one toggle hides all of it. visibility (not
     display) keeps slots sized and video decoding so the first-frame reveal
     still fires; anything added inside #tvView later is hidden automatically. */
  #tvView { position: fixed; inset: 0; }
  body.joining #tvView { visibility: hidden; }
  .room-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 26px 32px;
    background: rgba(18,18,18,0.94);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    font-family: system-ui, sans-serif;
  }
  .room-title { font-size: 1.05rem; font-weight: 600; color: rgba(255,255,255,0.88); }
  .room-qr {
    width: 168px;
    height: 168px;
    border-radius: 10px;
    background: #fff;
    padding: 8px;
    image-rendering: pixelated;
  }
  .room-howto { font-size: 0.85rem; color: #9a9a9a; text-align: center; max-width: 320px; }
  .room-domain {
    color: #e8e8e8;
    font-weight: 600;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .room-code {
    font: 700 2.2rem/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.2em;
    padding-left: 0.2em;   /* offset the trailing letter-spacing so it reads centered */
    color: #fff;
  }
  .room-or {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    color: #666;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .room-or::before, .room-or::after {
    content: "";
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.12);
  }
  .room-join-label { font-size: 0.8rem; color: #9a9a9a; text-align: center; max-width: 300px; }
  .room-join-label em { color: #cfcfcf; font-style: italic; }
  /* The panel is pointer-events:none so it never blocks the TV; re-enable the
     interactive join controls. */
  .room-join { display: flex; gap: 8px; pointer-events: auto; }
  .room-join-input {
    width: 150px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font: 600 1rem/1 ui-monospace, "SF Mono", Menlo, monospace;
    background: #0c0c0c;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 11px 12px;
    color: #fff;
  }
  .room-join-input:focus { outline: 2px solid #2563eb; }
  .room-join-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .room-join-btn:hover { background: #1d4ed8; }
  .room-join-error { font-size: 0.78rem; color: #f87171; min-height: 1em; text-align: center; max-width: 300px; }
</style>
</head>
<!-- Start hidden (joining) and with the room card hidden, so the very first
     paint is just black — JS then reveals the right view once it knows whether a
     hub is configured and has populated the card. Avoids a flash of the empty
     stage / unpopulated card before the module runs. -->
<body class="joining">

<!-- All TV-viewing chrome lives in one wrapper, so the join screen hides it with
     a single toggle (body.joining) instead of per-element rules. Full-viewport so
     #stage's height:100% still resolves. -->
<div id="tvView">
<!-- #stage is filled by receiver.ts: one .slot per entry in SENDER_IDS. -->
<div id="stage">
  <div class="tile" id="joinTile" hidden>
    <div class="join-inner">
      <img class="join-qr" alt="Join QR code">
      <div class="join-text">Scan, or open <span class="join-domain"></span><br>code <span class="join-code"></span></div>
    </div>
  </div>
</div>

<div id="controls">
  <button id="layoutBtn">
    <span id="layoutLabel">All screens</span>
    <span class="dots" id="layoutDots"></span>
  </button>
  <button id="fullscreenBtn" aria-label="Toggle fullscreen" title="Fullscreen (F)">
    <svg class="fs-enter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
    <svg class="fs-exit" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M8 21v-3a2 2 0 0 0-2-2H3M16 21v-3a2 2 0 0 1 2-2h3"/>
    </svg>
  </button>
</div>
<!-- Pills are built by receiver.ts, one per slot. -->
<div id="legend"><span id="legendView"></span></div>
<div id="hint">Colored buttons pick a screen — press one again for corners, then all</div>
</div><!-- /tvView -->

<div id="roomPanel" class="hidden">
  <div class="room-card">
    <div class="room-title">Share a screen here</div>
    <img id="roomQr" class="room-qr" alt="Join QR code">
    <div class="room-howto">Scan, or open <span id="roomDomain" class="room-domain"></span> and enter</div>
    <div id="roomCode" class="room-code">—</div>
    <div class="room-or"><span>or</span></div>
    <div class="room-join-label">Share <em>this</em> device’s screen to another display — enter its code:</div>
    <form id="joinForm" class="room-join" autocomplete="off">
      <input id="roomJoinInput" class="room-join-input" type="text" inputmode="text"
             autocapitalize="characters" spellcheck="false" maxlength="4" placeholder="K7P3"
             aria-label="Code of the screen to share to">
      <button id="roomJoinBtn" class="room-join-btn" type="submit">Join</button>
    </form>
    <div id="roomJoinError" class="room-join-error"></div>
  </div>
</div>

<!-- Classic script (not a module) so it sets a global `qrcode` the module reads. -->
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/js/receiver.js"></script>
</body>
</html>
